<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Annie 日文漢字 · 每日練習</title>
<style>
  :root {
    --bg: #fff8f3;
    --card: #ffffff;
    --accent: #ff8fab;
    --accent2: #7ec8e3;
    --mint: #98d4bb;
    --lavender: #c9b6e4;
    --text: #3d3a45;
    --muted: #8a8694;
    --shadow: 0 10px 30px rgba(61, 58, 69, 0.08);
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans TC", "PingFang HK", "Segoe UI", sans-serif;
    background: linear-gradient(165deg, #fff8f3 0%, #f3f0ff 50%, #e8f6ff 100%);
    color: var(--text);
    min-height: 100dvh;
    line-height: 1.5;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  header.app-header {
    text-align: center; padding: 20px 8px 12px;
  }
  header.app-header h1 {
    font-size: 1.45rem; font-weight: 700;
    background: linear-gradient(90deg, #ff8fab, #7ec8e3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header.app-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

  .nav {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    margin: 12px 0 20px;
  }
  .nav button, .btn {
    border: none; cursor: pointer; font: inherit;
    padding: 10px 18px; border-radius: 999px;
    background: var(--card); color: var(--text);
    box-shadow: var(--shadow); transition: transform .15s, background .15s;
  }
  .nav button:hover, .btn:hover { transform: translateY(-1px); }
  .nav button.active {
    background: linear-gradient(135deg, #ff8fab, #ffa8c5);
    color: #fff; font-weight: 600;
  }
  .btn-primary {
    background: linear-gradient(135deg, #7ec8e3, #98d4bb);
    color: #fff; font-weight: 600;
  }
  .btn-accent {
    background: linear-gradient(135deg, #ff8fab, #c9b6e4);
    color: #fff; font-weight: 600;
  }
  .btn-ghost {
    background: transparent; box-shadow: none;
    border: 2px solid #e8e4f0; color: var(--muted);
  }
  .hidden { display: none !important; }

  /* Home */
  .day-card {
    background: var(--card); border-radius: var(--radius);
    padding: 24px; box-shadow: var(--shadow); text-align: center;
  }
  .day-badge {
    display: inline-block; padding: 4px 14px; border-radius: 999px;
    background: #ffe4ec; color: #e05a80; font-size: 0.85rem; font-weight: 600;
    margin-bottom: 10px;
  }
  .day-card h2 { font-size: 1.5rem; margin-bottom: 6px; }
  .day-card .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .day-actions { display: flex; flex-direction: column; gap: 10px; }
  .day-actions .btn { width: 100%; padding: 14px; font-size: 1.05rem; }
  .coming { margin-top: 16px; color: var(--muted); font-size: 0.85rem; }

  /* Study */
  .study-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 8px;
  }
  .counter {
    font-weight: 700; color: var(--accent);
    background: #fff; padding: 6px 14px; border-radius: 999px;
    box-shadow: var(--shadow); font-size: 0.95rem;
  }
  .flip-scene {
    perspective: 1200px; margin: 0 auto 16px;
    width: 100%; max-width: 360px; aspect-ratio: 3/4;
  }
  .flip-card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d; transition: transform 0.55s ease;
    cursor: pointer; border-radius: var(--radius);
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: var(--radius); background: var(--card);
    box-shadow: var(--shadow); overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 20px;
  }
  .face.back { transform: rotateY(180deg); justify-content: flex-start; overflow-y: auto; }
  .face img {
    width: 70%; max-width: 220px; aspect-ratio: 1;
    object-fit: cover; border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 16px;
  }
  .kanji-big {
    font-size: clamp(3.5rem, 18vw, 5.5rem);
    font-weight: 700; line-height: 1; color: var(--text);
  }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
  .reading-block {
    width: 100%; margin: 8px 0; padding: 12px 14px;
    border-radius: 14px; background: #f8f5ff; text-align: left;
  }
  .reading-block.on { background: #eef7ff; }
  .reading-block.kun { background: #fff0f5; }
  .reading-label {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
    color: var(--muted); margin-bottom: 2px;
  }
  .reading-value {
    font-size: 1.35rem; font-weight: 700; color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .meaning-zh {
    font-size: 1.15rem; font-weight: 600; margin: 10px 0 4px; color: #e05a80;
  }
  .meaning-en { color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }
  .example-box {
    width: 100%; padding: 12px; border-radius: 12px;
    background: #f0faf5; font-size: 0.95rem; text-align: left;
  }
  .tts-btn {
    margin-top: 14px; padding: 10px 20px; border-radius: 999px;
    border: none; background: linear-gradient(135deg, #7ec8e3, #c9b6e4);
    color: #fff; font-weight: 600; cursor: pointer; font: inherit;
  }
  .controls {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    flex-wrap: wrap;
  }
  .controls .btn { min-width: 100px; }

  /* Test */
  .test-progress {
    height: 8px; background: #eee; border-radius: 999px; overflow: hidden;
    margin-bottom: 16px;
  }
  .test-progress .bar {
    height: 100%; background: linear-gradient(90deg, #ff8fab, #7ec8e3);
    width: 0%; transition: width .3s;
  }
  .q-card {
    background: var(--card); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow);
  }
  .q-type {
    display: inline-block; font-size: 0.75rem; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; background: #eef7ff;
    color: #4a90b8; margin-bottom: 12px;
  }
  .q-prompt { font-size: 1.1rem; margin-bottom: 16px; text-align: center; }
  .q-prompt .big-kanji { font-size: 4rem; font-weight: 700; display: block; margin: 8px 0; }
  .q-prompt img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 14px;
    display: block; margin: 10px auto;
  }
  .choices { display: grid; gap: 10px; }
  .choice {
    padding: 14px; border-radius: 14px; border: 2px solid #eee;
    background: #fafafa; cursor: pointer; font: inherit; text-align: center;
    font-size: 1.1rem; transition: border-color .15s, background .15s;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent2); }
  .choice.correct { border-color: #5cb88a; background: #e8f8f0; }
  .choice.wrong { border-color: #e07a8a; background: #ffeef1; }
  .choice:disabled { cursor: default; opacity: 0.95; }
  .feedback {
    margin-top: 14px; padding: 12px; border-radius: 12px;
    background: #f8f5ff; font-size: 0.95rem; text-align: center;
  }
  .result-card { text-align: center; }
  .score-big { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 10px 0; }
  .wrong-list { text-align: left; margin-top: 16px; }
  .wrong-item {
    padding: 12px; border-radius: 12px; background: #fff5f7;
    margin-bottom: 8px; font-size: 0.9rem;
  }
  .wrong-item strong { color: #e05a80; }

  footer.note {
    text-align: center; color: var(--muted); font-size: 0.75rem;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>🌸 Annie 日文漢字</h1>
    <p>JLPT N3–N2 · 香港學習用</p>
  </header>

  <nav class="nav" id="mainNav">
    <button type="button" data-view="home" class="active">主頁</button>
    <button type="button" data-view="study">開始翻卡</button>
    <button type="button" data-view="test">今日小測</button>
  </nav>

  <!-- HOME -->
  <section id="view-home">
    <div class="day-card">
      <span class="day-badge">今日</span>
      <h2>Day 1 · 日常生活</h2>
      <p class="meta">20 個漢字 · 開關・通勤・買賣・健康</p>
      <div class="day-actions">
        <button type="button" class="btn btn-primary" id="btnStartStudy">📖 開始翻卡</button>
        <button type="button" class="btn btn-accent" id="btnStartTest">✏️ 今日小測</button>
      </div>
      <p class="coming">Day 2、Day 3 … 稍後加入</p>
    </div>
  </section>

  <!-- STUDY -->
  <section id="view-study" class="hidden">
    <div class="study-top">
      <button type="button" class="btn btn-ghost" id="btnStudyHome">← 主頁</button>
      <span class="counter" id="cardCounter">1 / 20</span>
      <span style="width:64px"></span>
    </div>
    <div class="flip-scene">
      <div class="flip-card" id="flipCard" tabindex="0" role="button" aria-label="撳一下翻卡">
        <div class="face front" id="cardFront"></div>
        <div class="face back" id="cardBack"></div>
      </div>
    </div>
    <div class="controls">
      <button type="button" class="btn" id="btnPrev">← 上一張</button>
      <button type="button" class="btn btn-primary" id="btnFlip">翻卡</button>
      <button type="button" class="btn" id="btnNext">下一張 →</button>
    </div>
  </section>

  <!-- TEST -->
  <section id="view-test" class="hidden">
    <div class="study-top">
      <button type="button" class="btn btn-ghost" id="btnTestHome">← 主頁</button>
      <span class="counter" id="testCounter">題 1 / 10</span>
      <span style="width:64px"></span>
    </div>
    <div class="test-progress"><div class="bar" id="testBar"></div></div>
    <div id="testArea"></div>
  </section>

  <footer class="note">離線可用 · 資料喺 day1/ · 讀音：音読み／訓読み</footer>
</div>

<script>
const DAY_PATH = "day1/";
let cards = [];
let idx = 0;
let flipped = false;
let testQ = [];
let testI = 0;
let testScore = 0;
let testAnswers = [];

async function loadCards() {
  const res = await fetch(DAY_PATH + "cards.json");
  cards = await res.json();
}

function showView(name) {
  ["home", "study", "test"].forEach(v => {
    document.getElementById("view-" + v).classList.toggle("hidden", v !== name);
  });
  document.querySelectorAll("#mainNav button").forEach(b => {
    b.classList.toggle("active", b.dataset.view === name);
  });
}

function imgSrc(c) {
  return DAY_PATH + c.image;
}

function renderCard() {
  const c = cards[idx];
  flipped = false;
  document.getElementById("flipCard").classList.remove("flipped");
  document.getElementById("cardCounter").textContent = `${idx + 1} / ${cards.length}`;

  document.getElementById("cardFront").innerHTML = `
    <img src="${imgSrc(c)}" alt="${c.meaning_en}" />
    <div class="kanji-big">${c.kanji}</div>
    <p class="hint">撳卡睇讀音同意思</p>
  `;

  const on = c.readings.on || "—";
  const kun = c.readings.kun || "—";
  document.getElementById("cardBack").innerHTML = `
    <div class="kanji-big" style="font-size:2.8rem;margin-bottom:8px">${c.kanji}</div>
    <div class="reading-block on">
      <div class="reading-label">音読み（音）</div>
      <div class="reading-value">${on}</div>
    </div>
    <div class="reading-block kun">
      <div class="reading-label">訓読み（訓）</div>
      <div class="reading-value">${kun}</div>
    </div>
    <div class="meaning-zh">粵語意思：${c.meaning_zh_hk}</div>
    <div class="meaning-en">${c.meaning_en}</div>
    <div class="example-box"><strong>例句／詞：</strong>${c.example}</div>
    <button type="button" class="tts-btn" id="ttsBtn">🔊 讀一次</button>
  `;
  document.getElementById("ttsBtn").onclick = (e) => {
    e.stopPropagation();
    speakCard(c);
  };
}

function speakCard(c) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const parts = [];
  if (c.readings.kun && c.readings.kun !== "—") {
    // speak first kun reading in hiragana-ish: use example word reading if possible
    parts.push(c.readings.kun.split("・")[0]);
  } else if (c.readings.on) {
    parts.push(c.readings.on);
  }
  // Prefer speaking the example word's kana from parentheses
  const m = c.example.match(/（([^）]+)）/);
  const text = m ? m[1].split("・")[0] : (parts[0] || c.kanji);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function flip() {
  flipped = !flipped;
  document.getElementById("flipCard").classList.toggle("flipped", flipped);
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  renderCard();
}
function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  renderCard();
}

/* ---- TEST ---- */
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickWrong(correct, fieldFn, n = 3) {
  const others = shuffle(cards.filter(c => c.id !== correct.id));
  const opts = [fieldFn(correct)];
  for (const o of others) {
    const v = fieldFn(o);
    if (!opts.includes(v)) opts.push(v);
    if (opts.length >= n + 1) break;
  }
  return shuffle(opts);
}

function buildQuiz() {
  const pool = shuffle(cards);
  const qs = [];

  // 3× image/meaning → kanji
  for (let i = 0; i < 3; i++) {
    const c = pool[i];
    qs.push({
      type: "img2kanji",
      typeLabel: "睇圖揀漢字",
      card: c,
      prompt: `邊個漢字代表「${c.meaning_zh_hk}」？`,
      showImg: true,
      choices: pickWrong(c, x => x.kanji),
      answer: c.kanji,
      explain: `${c.kanji}　音 ${c.readings.on}　訓 ${c.readings.kun}`
    });
  }

  // 4× kanji → reading (mix on/kun)
  for (let i = 3; i < 7; i++) {
    const c = pool[i];
    const askOn = i % 2 === 0 && c.readings.on && c.readings.on !== "—";
    const correct = askOn ? c.readings.on : (c.readings.kun !== "—" ? c.readings.kun : c.readings.on);
    const label = askOn ? "音読み" : "訓読み";
    qs.push({
      type: "kanji2read",
      typeLabel: `揀正確${label}`,
      card: c,
      prompt: `<span class="big-kanji">${c.kanji}</span>正確嘅<strong>${label}</strong>係？`,
      showImg: false,
      choices: pickWrong(c, x => {
        if (askOn) return x.readings.on;
        return x.readings.kun !== "—" ? x.readings.kun : x.readings.on;
      }),
      answer: correct,
      explain: `${c.kanji}　音 ${c.readings.on}　訓 ${c.readings.kun}　（${c.meaning_zh_hk}）`
    });
  }

  // 3× example → meaning
  for (let i = 7; i < 10; i++) {
    const c = pool[i];
    const word = c.example.split("—")[0].trim();
    qs.push({
      type: "ex2mean",
      typeLabel: "例句意思",
      card: c,
      prompt: `「${word}」嘅意思係？`,
      showImg: false,
      choices: pickWrong(c, x => x.meaning_zh_hk),
      answer: c.meaning_zh_hk,
      explain: `${c.kanji}　${c.example}`
    });
  }

  return shuffle(qs).slice(0, 10);
}

function startTest() {
  testQ = buildQuiz();
  testI = 0;
  testScore = 0;
  testAnswers = [];
  showView("test");
  renderQuestion();
}

function renderQuestion() {
  const area = document.getElementById("testArea");
  if (testI >= testQ.length) {
    renderResult();
    return;
  }
  const q = testQ[testI];
  document.getElementById("testCounter").textContent = `題 ${testI + 1} / ${testQ.length}`;
  document.getElementById("testBar").style.width = `${(testI / testQ.length) * 100}%`;

  let promptHtml = `<div class="q-prompt">${q.prompt}`;
  if (q.showImg) promptHtml += `<img src="${imgSrc(q.card)}" alt="" />`;
  promptHtml += `</div>`;

  area.innerHTML = `
    <div class="q-card">
      <span class="q-type">${q.typeLabel}</span>
      ${promptHtml}
      <div class="choices" id="choices">
        ${q.choices.map(ch => `<button type="button" class="choice" data-val="${encodeURIComponent(ch)}">${ch}</button>`).join("")}
      </div>
      <div id="qFeedback" class="feedback hidden"></div>
      <div style="margin-top:14px;text-align:center" class="hidden" id="nextQWrap">
        <button type="button" class="btn btn-primary" id="btnNextQ">下一題 →</button>
      </div>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => answerQ(btn, q));
  });
}

function answerQ(btn, q) {
  const val = decodeURIComponent(btn.dataset.val);
  const correct = val === q.answer;
  if (correct) testScore++;
  testAnswers.push({ q, chosen: val, correct });

  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    const v = decodeURIComponent(b.dataset.val);
    if (v === q.answer) b.classList.add("correct");
    if (v === val && !correct) b.classList.add("wrong");
  });

  const fb = document.getElementById("qFeedback");
  fb.classList.remove("hidden");
  fb.innerHTML = correct
    ? `✅ 啱！<br>${q.explain}`
    : `❌ 唔啱。正解：<strong>${q.answer}</strong><br>${q.explain}`;
  document.getElementById("nextQWrap").classList.remove("hidden");
  document.getElementById("btnNextQ").onclick = () => {
    testI++;
    renderQuestion();
  };
  document.getElementById("testBar").style.width = `${((testI + 1) / testQ.length) * 100}%`;
}

function renderResult() {
  document.getElementById("testCounter").textContent = "完成！";
  document.getElementById("testBar").style.width = "100%";
  const wrongs = testAnswers.filter(a => !a.correct);
  const area = document.getElementById("testArea");
  area.innerHTML = `
    <div class="q-card result-card">
      <h2>今日小測結果</h2>
      <div class="score-big">${testScore} / ${testQ.length}</div>
      <p>${testScore === testQ.length ? "完美！太叻啦 🎉" : testScore >= 7 ? "唔錯呀，繼續加油 💪" : "再翻卡溫習吓啦 📖"}</p>
      ${wrongs.length ? `
        <div class="wrong-list">
          <h3 style="margin-bottom:8px">需要再睇：</h3>
          ${wrongs.map(w => `
            <div class="wrong-item">
              <strong>${w.q.card.kanji}</strong> — 你揀咗「${w.chosen}」<br>
              正解：${w.q.answer}<br>
              音 ${w.q.card.readings.on}　／　訓 ${w.q.card.readings.kun}
            </div>
          `).join("")}
        </div>
      ` : ""}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
        <button type="button" class="btn btn-accent" id="btnRetry">再試一次</button>
        <button type="button" class="btn btn-primary" id="btnBackStudy">返去翻卡</button>
        <button type="button" class="btn btn-ghost" id="btnBackHome">主頁</button>
      </div>
    </div>
  `;
  document.getElementById("btnRetry").onclick = startTest;
  document.getElementById("btnBackStudy").onclick = () => { showView("study"); renderCard(); };
  document.getElementById("btnBackHome").onclick = () => showView("home");
}

/* ---- wire up ---- */
document.getElementById("mainNav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  if (b.dataset.view === "study") { showView("study"); renderCard(); }
  else if (b.dataset.view === "test") startTest();
  else showView("home");
});
document.getElementById("btnStartStudy").onclick = () => { showView("study"); renderCard(); };
document.getElementById("btnStartTest").onclick = startTest;
document.getElementById("btnStudyHome").onclick = () => showView("home");
document.getElementById("btnTestHome").onclick = () => showView("home");
document.getElementById("btnFlip").onclick = flip;
document.getElementById("btnNext").onclick = nextCard;
document.getElementById("btnPrev").onclick = prevCard;
document.getElementById("flipCard").onclick = (e) => {
  if (e.target.closest("#ttsBtn")) return;
  flip();
};

document.addEventListener("keydown", e => {
  if (document.getElementById("view-study").classList.contains("hidden")) return;
  if (e.key === "ArrowRight") nextCard();
  else if (e.key === "ArrowLeft") prevCard();
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});

loadCards().then(() => {
  console.log("Loaded", cards.length, "cards");
}).catch(err => {
  document.getElementById("view-home").innerHTML =
    `<div class="day-card"><p>載入失敗：請用本地伺服器開啟，或確認 day1/cards.json 存在。<br>${err}</p></div>`;
});
</script>
</body>
</html>
